backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:

      # ---------------- HOME ----------------
      - file: "home.json"
        label: "Home Page"
        name: "home"
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the title", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "lede", widget: "text"}
          - label: "Intro Section"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Small headline above paragraph", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - {label: "Photo", name: "photo", widget: "image"}
          - label: "Stats Row"
            name: "stats"
            widget: "list"
            summary: "{{value}} — {{label}}"
            fields:
              - {label: "Number/word", name: "value", widget: "string"}
              - {label: "Label underneath", name: "label", widget: "string"}
          - label: "\"Right Now\" Highlight Cards"
            name: "highlights"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Link (e.g. programs.html#circle)", name: "link", widget: "string"}
          - label: "Bottom Call-to-Action"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button text", name: "buttonText", widget: "string"}
              - {label: "Button link", name: "buttonLink", widget: "string"}

      # ---------------- ABOUT ----------------
      - file: "about.json"
        label: "About Page"
        name: "about"
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the title", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "lede", widget: "text"}
          - label: "Mission Statement"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Small headline", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
          - label: "History (Foundation)"
            name: "history"
            widget: "object"
            fields:
              - {label: "Small headline", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro line", name: "intro", widget: "text"}
              - label: "Timeline"
                name: "timeline"
                widget: "list"
                summary: "{{year}}"
                fields:
                  - {label: "Year", name: "year", widget: "string"}
                  - {label: "What happened", name: "text", widget: "text"}
          - label: "History (The Warehouse Building)"
            name: "warehouse"
            widget: "object"
            fields:
              - {label: "Small headline", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
          - label: "Board of Directors"
            name: "board"
            widget: "list"
            summary: "{{name}} — {{role}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role/Title", name: "role", widget: "string"}
              - {label: "Photo (leave blank for initials placeholder)", name: "photo", widget: "image", required: false}
              - {label: "Bio (leave blank if not yet written)", name: "bio", widget: "text", required: false}

      # ---------------- PROGRAMS & EVENTS ----------------
      - file: "programs.json"
        label: "Programs & Events Page"
        name: "programs"
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the title", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "lede", widget: "text"}
          - label: "Sub-navigation Tabs"
            name: "tabs"
            widget: "list"
            summary: "{{label}}"
            hint: "Must match a Program's ID below exactly so the tab links jump to the right section."
            fields:
              - {label: "ID (matches a program's ID, no spaces)", name: "id", widget: "string"}
              - {label: "Tab label", name: "label", widget: "string"}
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "ID (no spaces, e.g. 'circle')", name: "id", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "When/Where line", name: "when", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - label: "Schedule table (optional — leave empty if not needed)"
                name: "schedule"
                widget: "list"
                required: false
                summary: "{{day}} — {{who}}"
                fields:
                  - {label: "Day", name: "day", widget: "string"}
                  - {label: "Time", name: "time", widget: "string"}
                  - {label: "Who", name: "who", widget: "string"}

      # ---------------- MEDIA & GALLERY ----------------
      - file: "media.json"
        label: "Media & Gallery Page"
        name: "media"
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the title", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "lede", widget: "text"}
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - {label: "Small headline", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro text", name: "intro", widget: "text"}
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{caption}}"
                fields:
                  - {label: "Photo", name: "img", widget: "image"}
                  - {label: "Caption", name: "caption", widget: "string"}
          - label: "Live Audio"
            name: "audio"
            widget: "object"
            fields:
              - {label: "Small headline", name: "kicker", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Link button text", name: "linkText", widget: "string"}
              - {label: "Link URL", name: "linkUrl", widget: "string"}
          - label: "Press Releases"
            name: "press"
            widget: "list"
            summary: "{{date}}"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Release text", name: "text", widget: "text"}
          - label: "Social Callout"
            name: "social"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Link button text", name: "linkText", widget: "string"}
              - {label: "Link URL", name: "linkUrl", widget: "string"}

      # ---------------- SUPPORT & CONTACT ----------------
      - file: "support.json"
        label: "Support & Contact Page"
        name: "support"
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the title", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "lede", widget: "text"}
          - label: "Donate Box"
            name: "donate"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button text", name: "buttonText", widget: "string"}
              - {label: "PayPal donate link", name: "paypalUrl", widget: "string"}
          - label: "Merchandise Box"
            name: "merch"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button text", name: "buttonText", widget: "string"}
              - {label: "Shop URL (leave blank to hide the button)", name: "shopUrl", widget: "string", required: false}
          - label: "Guidestar/Candid Box"
            name: "membership"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button text", name: "buttonText", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Venue name", name: "venueName", widget: "string"}
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Phone", name: "phone", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Note", name: "note", widget: "text"}
